# The configuration that produced the reported results, with every
# credential replaced by an environment-variable placeholder. Generated by
# scripts/make_reported_config.py from the run configuration; do not edit.
#
# config/config.example.yaml remains a template and does NOT reproduce the
# study: its extraction date, per-query cap and frame counts differ from the
# run. Use this file.
run:
  label: main-2026
  random_seed: 20260101
  extraction_date: '2026-07-27'
  data_dir: data_main
retrieval:
  youtube_api_key: ${YOUTUBE_API_KEY}
  languages:
  - english
  region_code: US
  max_results_per_query: 250
  published_after: null
  published_before: null
  target_eligible_n: 2000
extraction:
  frame_rate_seconds: 30
  opening_boost_seconds: 5
  opening_window_minutes: 2
  max_frames_per_video: 24
  asr_model: whisper-base
  prefer_captions: true
  inter_video_delay_seconds: 4.0
  checkpoint_every: 10
  save_audio_sample: true
coding:
  models:
  - provider: anthropic_session
    model: claude-opus-4-8
    temperature: 0
  - provider: codex_cli
    model: gpt-5.6-sol
    temperature: 0
  adjudicator: null
  prompt_file: codebook/prompts/coding_v1.md
  prompt_variants_for_sensitivity:
  - codebook/prompts/coding_v2.md
  eligibility_prompt_file: codebook/prompts/eligibility_v1.md
  max_frames_per_call: 12
  test_retest_fraction: 0.1
  checkpoint_every: 10
  quota_streak_abort: 5
  screening_model:
    provider: google
    model: gemini-2.5-flash
    temperature: 0
  sens_fraction: 0.1
reliability:
  agreement_threshold_alpha: 0.6
  agreement_threshold_icc: 0.6
  human_subsample_n: 150
analysis:
  primary_outcomes:
  - like_rate
  - comment_rate
  secondary_outcomes:
  - video_power_index
  covariates:
  - session_length_min
  - subscriber_count
  - channel_type
  - recency_days
  random_effect: channel_id
  fdr_method: benjamini-hochberg
  vpi_formula: views_weight*log1p(view_count) + likes_weight*log1p(like_count)
  vpi_weights:
    views_weight: 1.0
    likes_weight: 1.0
secrets: ${REDACTED}
